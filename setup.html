<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch for Tesla</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px 16px 40px; font-family: -apple-system, Roboto, "Segoe UI", sans-serif; background: #000; color: #fff; line-height: 1.45; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 26px 0 8px; color: #e82127; }
  h2 .done { color: #34c759; }
  p, li { font-size: 15px; color: #d0d0d4; }
  .card { background: #1c1c1e; border-radius: 14px; padding: 14px; margin: 10px 0; }
  label { display: block; font-size: 13px; color: #9a9a9e; margin: 10px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; text-align: center; font-size: 16px; font-weight: 600; padding: 14px; margin-top: 12px; border-radius: 12px; border: 0; background: #2c2c2e; color: #fff; text-decoration: none; cursor: pointer; }
  button.primary, a.btn.primary { background: #e82127; }
  button:disabled { opacity: .4; }
  code, textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  textarea { width: 100%; box-sizing: border-box; height: 110px; border-radius: 10px; border: 1px solid #3a3a3c; background: #111; color: #ddd; padding: 10px; }
  .muted { color: #9a9a9e; font-size: 13px; }
  .ok { color: #34c759; }
  .warn { color: #ffb020; }
  .note { border-left: 3px solid #ffb020; padding-left: 10px; font-size: 14px; }
  ul.status { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.status li { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; color: #9a9a9e; }
  ul.status li::before { content: "○"; width: 16px; text-align: center; flex: none; }
  ul.status li.ok { color: #34c759; }
  ul.status li.ok::before { content: "✓"; }
  ul.status li.now { color: #fff; font-weight: 600; }
  ul.status li.now::before { content: "→"; color: #e82127; }
  ul.status li.wait { color: #ffb020; }
  ul.status li.wait::before { content: "…"; }
  details { margin-top: 14px; border-top: 1px solid #2c2c2e; padding-top: 10px; }
  summary { font-size: 14px; color: #d0d0d4; cursor: pointer; }
  .copyable { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; }
  .copyable code { flex: 1; min-width: 0; overflow-wrap: anywhere; background: #111; border-radius: 8px; padding: 9px 10px; }
  .copyable input { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; padding: 9px 10px; border-radius: 8px; }
  .copyable button { width: auto; flex: none; margin: 0; padding: 9px 12px; font-size: 13px; border-radius: 8px; }
</style>
</head>
<body>

<script src="setup-i18n.js"></script>

<div class="card" style="margin-top:0">
  <label for="lang" id="langLabel" style="margin-top:0"></label>
  <select id="lang">
    <option value="en">English</option>
    <option value="de">Deutsch</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="it">Italiano</option>
    <option value="nl">Nederlands</option>
  </select>
</div>

<h1 data-i18n="title"></h1>
<p class="muted" data-i18n="intro"></p>

<div class="card">
  <p style="margin:0" data-i18n="need"></p>
  <ul style="margin:6px 0 0;padding-left:20px">
    <li data-i18n="need1"></li>
    <li data-i18n="need2"></li>
    <li data-i18n="need3"></li>
  </ul>
  <p class="muted" style="margin-bottom:0" data-i18n="needNote"></p>
</div>

<div id="nowatch" class="card" hidden>
  <p class="warn" data-i18n="noWatch"></p>
</div>

<h2 id="h1"></h2>
<div class="card">
  <p data-i18n="p1a"></p>
  <p class="muted" data-i18n="p1b"></p>
  <label><span data-i18n="ghLabel"></span> <a href="https://github.com/signup" target="_blank" rel="noopener" class="muted" data-i18n="ghSignup"></a></label>
  <input id="ghuser" data-i18n-ph="ghPlaceholder" autocapitalize="none" autocorrect="off" spellcheck="false">
  <p class="muted" data-i18n="p1c"></p>

  <ul class="status" id="status" hidden>
    <li id="stRepo"><span data-i18n="stRepo"></span> <code class="dom"></code></li>
    <li id="stNoJekyll" data-i18n="stNoJekyll"></li>
    <li id="stKey" data-i18n="stKey"></li>
    <li id="stOnline" data-i18n="stOnline"></li>
  </ul>
  <p class="muted" id="glossary" data-i18n="glossary" hidden></p>
  <a id="next" class="btn primary" href="#" target="_blank" rel="noopener" hidden></a>
  <p id="hint" class="muted" hidden></p>

  <details id="autoBox">
    <summary data-i18n="autoSum"></summary>
    <p class="muted" data-i18n="autoP"></p>
    <a class="btn" href="https://github.com/settings/tokens/new?scopes=public_repo&description=Watch%20for%20Tesla%20Setup" target="_blank" rel="noopener" data-i18n="autoA"></a>
    <label data-i18n="autoB"></label>
    <input id="token" type="password" placeholder="ghp_…" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
    <button id="autoRun" class="primary" data-i18n="autoRun" disabled></button>
    <p id="autoLog" class="muted"></p>
  </details>

  <details>
    <summary data-i18n="hostSum"></summary>
    <p class="muted" data-i18n="hostP"></p>
    <textarea id="pem" readonly></textarea>
    <button id="copyPem" data-i18n="copyKey"></button>
  </details>
</div>

<h2 data-i18n="h2"></h2>
<div class="card">
  <p class="note" data-i18n="p2note"></p>
  <p data-i18n="p2intro"></p>
  <ul style="padding-left:20px">
    <li data-i18n="p2l1"></li>
    <li data-i18n="p2l2"></li>
    <li data-i18n="p2l3"></li>
  </ul>
  <p data-i18n="p2copy"></p>
  <label data-i18n="originLabel"></label>
  <div class="copyable"><input id="origin" placeholder="https://name.github.io" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false"><button data-copy="origin" data-i18n="copy"></button></div>
  <p class="muted" style="margin-top:-6px" data-i18n="originHint"></p>
  <label data-i18n="redirectLabel"></label>
  <div class="copyable"><code id="redirectPreview"></code><button data-copy="redirectPreview" data-i18n="copy"></button></div>
  <p class="note" data-i18n="redirectNote"></p>
  <label data-i18n="scopesLabel"></label>
  <p style="margin:4px 0 0" data-i18n="scopesNames"></p>
  <p class="muted" style="margin:2px 0 0">(vehicle_device_data, vehicle_cmds, vehicle_charging_cmds)</p>
  <p class="muted" data-i18n="billing"></p>
  <a class="btn" href="https://developer.tesla.com/dashboard" target="_blank" rel="noopener" data-i18n="openDev"></a>
</div>

<h2 data-i18n="h3"></h2>
<div class="card">
  <p id="haveBox" class="muted" hidden></p>
  <label data-i18n="clientIdLabel"></label>
  <input id="clientId" placeholder="xxxxxxxx-xxxx-…" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
  <p id="idWarn" class="warn" hidden></p>
  <label data-i18n="clientSecretLabel"></label>
  <input id="clientSecret" placeholder="ta-secret.…" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
  <details>
    <summary><span data-i18n="regionSum"></span> <span id="rdSummary" class="muted"></span></summary>
    <select id="region" style="margin-top:8px">
      <option value="eu" data-i18n="regionEu"></option>
      <option value="na" data-i18n="regionNa"></option>
      <option value="cn" data-i18n="regionCn"></option>
    </select>
  </details>
  <p id="sendWarn" class="warn" hidden></p>
  <p id="sentWarn" class="warn" data-i18n="sentWarn" hidden></p>
  <button id="send" class="primary" disabled></button>
  <p class="muted" data-i18n="notDone"></p>
  <ol class="muted" style="margin:4px 0 0;padding-left:20px">
    <li data-i18n="n1"></li>
    <li data-i18n="n2"></li>
    <li data-i18n="n3"></li>
    <li data-i18n="n4"></li>
  </ol>
  <p class="note" data-i18n="redirectHelp"></p>
  <p class="muted" data-i18n="nothingOpens"></p>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);

  // ---- Language ---------------------------------------------------------------------------
  // The app passes its own language as ?lang=; otherwise the browser's. The selector at the top changes it.
  const I18N = window.SETUP_I18N;
  const LANGS = Object.keys(I18N);
  const pickLang = tag => { const l = String(tag || '').toLowerCase().split(/[-_]/)[0]; return LANGS.includes(l) ? l : ''; };
  let lang = pickLang(q.get('lang')) || pickLang(sessionStorageGet('tw.lang')) ||
    (navigator.languages || [navigator.language]).map(pickLang).find(Boolean) || 'en';
  function sessionStorageGet(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function t(key, vars) {
    let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] === undefined ? '' : vars[k]));
    return s;
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    $('langLabel').textContent = t('language');
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.innerHTML = t(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  }

  // The credentials are sent to this address, so only the Wear OS companion endpoint is accepted.
  // A crafted link with another redirect_uri must not be able to collect a client secret.
  const rawRedirect = q.get('redirect_uri') || '';
  const redirect = /^https:\/\/wear\.googleapis(-cn)?\.com\/3p_auth\/[A-Za-z0-9_.]+$/.test(rawRedirect) ? rawRedirect : '';
  const state = q.get('state') || '';
  const pkB64 = q.get('pk') || '';
  const pkg = q.get('pkg') || 'com.hexwerk.teslawatch';
  // What the watch already holds (start of its Client ID, its domain). Shown as text only, so both are checked first.
  const haveId = /^[A-Za-z0-9-]{1,8}$/.test(q.get('cid') || '') ? q.get('cid') : '';
  const haveDomain = /^[a-z0-9.-]{1,100}$/.test(q.get('dom') || '') ? q.get('dom') : '';
  const KEY_PATH = '.well-known/appspecific/com.tesla.3p.public-key.pem';

  // The address the watch really uses when it is known (it differs on Chinese devices).
  $('redirectPreview').textContent = redirect || 'https://wear.googleapis.com/3p_auth/' + pkg;
  if (!redirect) $('nowatch').hidden = false;

  let pem = '';
  try { pem = decodeURIComponent(escape(atob(pkB64.replace(/-/g, '+').replace(/_/g, '/')))); } catch (e) { pem = ''; }

  // Mobile browsers may reload this tab after a trip to GitHub; keep the non-secret fields.
  const store = {
    get(k) { try { return sessionStorage.getItem('tw.' + k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { sessionStorage.setItem('tw.' + k, v); } catch (e) {} },
  };

  const ghuser = $('ghuser'), originInput = $('origin'), region = $('region'), token = $('token');
  // "https://Name.github.io/" -> "name.github.io"; Tesla wants the bare host.
  const domain = () => originInput.value.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  const squash = s => (s || '').replace(/\s+/g, '');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const user = () => { const u = ghuser.value.trim().replace(/^@/, '').toLowerCase(); return /^[a-z\d](?:[a-z\d-]{0,38})$/.test(u) ? u : ''; };

  // ---- GitHub state detection -------------------------------------------------------------
  let st = {};            // { repo, empty, branch, nojekyll, key: 'ok' | 'other' | '', online, limited }
  let autoOrigin = '';
  let apiCalls = 0, checking = false, checkedFor = '';
  const keyCache = {};    // blob sha -> matches this watch's key

  async function gh(path, opt) {
    opt = opt || {};
    const headers = Object.assign({ Accept: 'application/vnd.github+json' }, opt.headers);
    const t = token.value.trim();
    if (t) headers.Authorization = 'Bearer ' + t;
    if (opt.body) headers['Content-Type'] = 'application/json';
    apiCalls++;
    return fetch('https://api.github.com' + path, { method: opt.method || 'GET', headers, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: 'no-store' });
  }

  async function isOnline(dom) {
    try {
      const r = await fetch('https://' + dom + '/' + KEY_PATH + '?t=' + Date.now(), { cache: 'no-store' });
      return r.ok && squash(await r.text()) === squash(pem);
    } catch (e) { return false; }
  }

  // useApi = false only polls the published file, which does not count against GitHub's rate limit.
  async function check(useApi) {
    const u = user();
    if (!u || !pem || checking) return;
    checking = true;
    try {
      const repo = u + '.github.io';
      if (checkedFor !== u) { st = {}; checkedFor = u; }
      if (await isOnline(domain() || repo)) { st = { repo: true, nojekyll: true, key: 'ok', online: true }; return; }
      if (u !== user()) return;
      st.online = false;
      if (!useApi || (st.nojekyll && st.key === 'ok')) return;
      if (!token.value.trim() && apiCalls > 45) { st.limited = true; return; }

      // Only a real account name gives a <name>.github.io domain, so check it before anything is created.
      if (!st.userOk) {
        const who = await gh('/users/' + u);
        if (u !== user()) return;
        if (who.status === 404) { st = { noUser: true }; return; }
        if (who.ok) st.userOk = true;
      }

      const r = await gh('/repos/' + u + '/' + repo + '/git/trees/HEAD?recursive=1');
      if (u !== user()) return;
      if (r.status === 404) { st = { repo: false }; return; }
      if (r.status === 409) { st = { repo: true, empty: true, branch: 'main' }; return; }
      if (!r.ok) { st.limited = true; return; }
      const tree = (await r.json()).tree || [];
      st.limited = false; st.repo = true; st.empty = false;
      st.nojekyll = tree.some(f => f.path === '.nojekyll');
      if (!st.branch || st.branch === 'main') {
        const info = await gh('/repos/' + u + '/' + repo);
        st.branch = info.ok ? (await info.json()).default_branch : 'main';
      }
      const blob = tree.find(f => f.path === KEY_PATH);
      if (!blob) { st.key = ''; return; }
      if (!(blob.sha in keyCache)) {
        const c = await gh('/repos/' + u + '/' + repo + '/contents/' + KEY_PATH, { headers: { Accept: 'application/vnd.github.raw' } });
        if (c.ok) keyCache[blob.sha] = squash(await c.text()) === squash(pem);
      }
      st.key = keyCache[blob.sha] === false ? 'other' : 'ok';
    } catch (e) {
      st.limited = true;
    } finally {
      checking = false;
      render();
    }
  }

  function setRow(id, cls) { $(id).className = cls; }

  function render() {
    const u = user();
    const dom = u ? u + '.github.io' : '';
    document.querySelectorAll('.dom').forEach(e => e.textContent = dom);
    $('pem').value = pem || t('noKey');
    if (haveId) {
      $('haveBox').textContent = t('have', { id: haveId, domain: haveDomain ? t('haveDomain', { dom: haveDomain }) : '' });
      $('haveBox').hidden = false;
    }
    // Follow the username until the origin was edited by hand.
    if (dom && (!originInput.value || originInput.value === autoOrigin)) originInput.value = 'https://' + dom;
    if (dom) autoOrigin = 'https://' + dom;
    $('rdSummary').textContent = '· ' + region.options[region.selectedIndex].text;

    const next = $('next'), hint = $('hint');
    $('status').hidden = $('glossary').hidden = next.hidden = hint.hidden = !u || !pem;
    $('h1').innerHTML = t('h1') + (st.online ? ' <span class="done">✓</span>' : '');
    validate();
    if (!u || !pem) return;

    if (st.noUser) {
      $('status').hidden = $('glossary').hidden = next.hidden = true;
      hint.className = 'warn';
      hint.textContent = t('noUser', { u });
      return;
    }
    hint.className = 'muted';
    // Don't offer to create anything before the account name is confirmed.
    if (!st.userOk && !st.limited && !st.online) {
      $('status').hidden = $('glossary').hidden = next.hidden = true;
      hint.textContent = t('checkingUser', { u });
      return;
    }

    const base = 'https://github.com/' + u + '/' + dom;
    const newFile = (name, value) => base + '/new/' + encodeURIComponent(st.branch || 'main') + '?filename=' + encodeURIComponent(name) + '&value=' + encodeURIComponent(value);
    // GitHub saves in two taps: "Commit changes…" opens a dialog with its own "Commit changes" button.
    const commitHint = t('commitHint');
    const steps = [
      { id: 'stRepo', done: st.repo, label: t('stepRepo'), href: 'https://github.com/new?name=' + encodeURIComponent(dom) + '&visibility=public&description=' + encodeURIComponent('Tesla Public Key (Watch for Tesla)'),
        hint: t('repoHint') },
      { id: 'stNoJekyll', done: st.nojekyll, label: t('stepNoJekyll'), href: newFile('.nojekyll', ' '),
        hint: commitHint },
      { id: 'stKey', done: st.key === 'ok', label: st.key === 'other' ? t('stepKeyReplace') : t('stepKeyNew'),
        href: st.key === 'other' ? base + '/edit/' + encodeURIComponent(st.branch || 'main') + '/' + KEY_PATH : newFile(KEY_PATH, pem),
        hint: st.key === 'other' ? t('keyOtherHint') : commitHint },
    ];
    const current = steps.find(s => !s.done);
    steps.forEach(s => setRow(s.id, s.done ? 'ok' : s === current ? 'now' : ''));
    setRow('stOnline', st.online ? 'ok' : current ? '' : 'wait');

    next.hidden = !current;
    if (current) {
      next.textContent = current.label;
      next.href = current.href;
      hint.textContent = current.hint + (st.limited ? t('limitedNote') : '');
    } else if (st.online) {
      hint.innerHTML = t('doneHint', { dom });
    } else {
      hint.textContent = t('publishing');
    }
  }

  $('next').addEventListener('click', () => {
    if (st.key === 'other' && st.repo && st.nojekyll) { try { navigator.clipboard.writeText(pem); } catch (e) {} }
    // Without status detection fall through the steps one by one.
    if (st.limited) setTimeout(() => {
      if (!st.repo) { st.repo = true; st.branch = 'main'; } else if (!st.nojekyll) st.nojekyll = true; else st.key = 'ok';
      render();
    }, 1000);
  });

  let debounce;
  ghuser.addEventListener('input', () => {
    store.set('ghuser', ghuser.value);
    st = {}; checkedFor = '';
    render();
    clearTimeout(debounce);
    debounce = setTimeout(() => check(true), 700);
  });
  // Coming back from GitHub: ask the API a few times in quick succession, then fall back to the slow cadence.
  let tick = 0, burst = 0;
  const cameBack = () => { burst = 3; check(true); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) cameBack(); });
  window.addEventListener('focus', cameBack);
  setInterval(() => {
    if (document.hidden || st.online || !user()) return;
    tick++;
    check(burst-- > 0 || tick % 4 === 0);   // published file every 6 s, GitHub API every 24 s
  }, 6000);

  // ---- Automatic setup with a token -------------------------------------------------------
  const autoRun = $('autoRun'), autoLog = $('autoLog');
  token.addEventListener('input', () => { autoRun.disabled = !token.value.trim() || !pem; });

  async function putFile(repoPath, path, content, log) {
    const url = repoPath + '/contents/' + path;
    for (let attempt = 0; ; attempt++) {
      const cur = await gh(url);
      let sha;
      if (cur.ok) {
        const j = await cur.json();
        if (squash(atob(squash(j.content))) === squash(content)) return;
        sha = j.sha;
      }
      const r = await gh(url, { method: 'PUT', body: { message: log, content: btoa(content), sha } });
      if (r.ok) return;
      if (attempt >= 3) throw new Error(path + ': ' + ((await r.json().catch(() => ({}))).message || r.status));
      await sleep(1500);   // a freshly created repository needs a moment
    }
  }

  autoRun.addEventListener('click', async () => {
    autoRun.disabled = true;
    const say = text => { autoLog.className = 'muted'; autoLog.textContent = text; };
    try {
      say(t('autoLogin'));
      const me = await gh('/user');
      if (!me.ok) throw new Error(me.status === 401 ? t('tokenInvalid') : t('ghAnswers', { status: me.status }));
      const login = (await me.json()).login.toLowerCase();
      ghuser.value = login; store.set('ghuser', login);
      st = {}; checkedFor = login; render();
      const repo = login + '.github.io', repoPath = '/repos/' + login + '/' + repo;

      const have = await gh(repoPath);
      if (have.status === 404) {
        say(t('creatingRepo', { repo }));
        const made = await gh('/user/repos', { method: 'POST', body: { name: repo, description: 'Tesla Public Key (Watch for Tesla)', private: false } });
        if (!made.ok) throw new Error(t('repoError', { msg: (await made.json().catch(() => ({}))).message || made.status }));
      } else if (have.ok && (await have.json()).private) {
        throw new Error(t('repoPrivate', { repo }));
      }
      st.repo = true; render();
      say(t('makingNoJekyll'));
      await putFile(repoPath, '.nojekyll', '\n', 'Add .nojekyll (Watch for Tesla)');
      st.nojekyll = true; render();
      say(t('makingKey'));
      await putFile(repoPath, KEY_PATH, pem, 'Add Tesla public key (Watch for Tesla)');
      st.key = 'ok'; render();
      // User sites publish on their own; this only helps when Pages was switched off.
      await gh(repoPath + '/pages', { method: 'POST', body: { source: { branch: 'main', path: '/' } } }).catch(() => {});
      autoLog.className = 'ok';
      autoLog.innerHTML = t('autoDone');
      check(false);
    } catch (e) {
      autoLog.className = 'warn';
      autoLog.textContent = t('autoFail', { msg: e.message });
    } finally {
      autoRun.disabled = !token.value.trim();
    }
  });

  // ---- Copy helpers -----------------------------------------------------------------------
  async function copy(text, btn) {
    const old = btn.textContent;
    try { await navigator.clipboard.writeText(text); btn.textContent = t('copied'); } catch (e) { btn.textContent = t('selectManually'); }
    setTimeout(() => { btn.textContent = old; }, 1500);
  }
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => { const el = $(b.dataset.copy); copy(el.value !== undefined ? el.value.trim() : el.textContent, b); }));
  $('copyPem').addEventListener('click', () => copy(pem, $('copyPem')));

  // ---- Send to the watch ------------------------------------------------------------------
  const send = $('send');
  const fields = ['origin', 'clientId', 'clientSecret'].map($);
  function validate() {
    send.disabled = !redirect || !domain() || fields.some(f => !f.value.trim());
    // Two developer apps is the usual way to end up with a Client ID whose redirect URI is missing.
    const typedId = $('clientId').value.trim().toLowerCase();
    const idWarn = $('idWarn');
    idWarn.hidden = !haveId || typedId.length < 8 || typedId.startsWith(haveId.toLowerCase());
    if (!idWarn.hidden) idWarn.textContent = t('otherId', { id: haveId });
    const warn = $('sendWarn');
    warn.hidden = send.disabled || st.online || !user();
    if (!warn.hidden) {
      const dom = domain();
      warn.textContent = dom !== user() + '.github.io'
        ? t('warnDomain', { dom })
        : t('warnPart1', { why:
          st.key === 'other' ? t('whyOther', { dom })
          : !st.repo ? t('whyRepo', { dom })
          : !st.nojekyll ? t('whyNoJekyll')
          : !st.key ? t('whyKey')
          : t('whyOnline', { dom }) });
    }
  }
  fields.forEach(f => f.addEventListener('input', validate));
  $('clientId').addEventListener('input', () => store.set('clientId', $('clientId').value));
  let originDebounce;
  originInput.addEventListener('input', () => {
    store.set('origin', originInput.value);
    st.online = false; render();
    clearTimeout(originDebounce);
    originDebounce = setTimeout(() => check(false), 700);
  });
  originInput.addEventListener('blur', () => {
    if (!domain()) return;
    originInput.value = 'https://' + domain();
    store.set('origin', originInput.value);
  });
  region.addEventListener('change', () => { store.set('region', region.value); render(); });

  ghuser.value = store.get('ghuser');
  $('clientId').value = store.get('clientId');
  originInput.value = store.get('origin');
  // Opened again from a watch that is already set up: a new tab has nothing stored, and without a domain
  // the send button would stay disabled with no reason shown. Not after a reload with a stored name: the origin follows that.
  if (!originInput.value && !ghuser.value && haveDomain) {
    originInput.value = 'https://' + haveDomain;
    const m = /^([a-z\d-]+)\.github\.io$/.exec(haveDomain);
    if (m) ghuser.value = m[1];
  }
  // A restored origin that still matches the username keeps following it.
  if (originInput.value && originInput.value === 'https://' + user() + '.github.io') autoOrigin = originInput.value;
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  region.value = store.get('region') || (/^(Asia\/(Shanghai|Chongqing|Harbin|Urumqi))$/.test(tz) ? 'cn' : /^(America|Pacific\/Honolulu|US|Canada)/.test(tz) ? 'na' : 'eu');

  // The watch takes one answer per opening of this page. Once it has one (or stopped waiting), a second send ends
  // on Google's page with a dead ALLOW button. The page cannot tell whether the first send arrived.
  function showSent() {
    const sent = !!state && store.get('sent') === state;
    $('sentWarn').hidden = !sent;
    send.textContent = t(sent ? 'sendAgain' : 'send');
  }
  function refreshAll() { applyLang(); showSent(); render(); }
  $('lang').addEventListener('change', () => { lang = $('lang').value; try { sessionStorage.setItem('tw.lang', lang); } catch (e) {} refreshAll(); });
  refreshAll();
  check(true);
  // "Back" restores the page without running this script again.
  window.addEventListener('pageshow', e => {
    if (e.persisted) { $('clientSecret').value = ''; validate(); }
    showSent();
  });

  send.addEventListener('click', () => {
    const data = {
      region: region.value,
      domain: domain(),
      clientId: $('clientId').value.trim(),
      clientSecret: $('clientSecret').value.trim(),
    };
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    store.set('sent', state);   // only the state, never the secret
    location.href = redirect + '?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state);
  });
})();
</script>
</body>
</html>
